name: Instalador Windows
# Gera EzTractor-Setup-<versão>.exe num Windows do GitHub, roda o autoteste do app empacotado
# e publica o instalador. Em tags v* (ex.: v0.5.0) cria um Release com o .exe para download.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão para publicar como Release (ex.: 0.5.0). Vazio = só gera o instalador."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    if: github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Versão
        shell: pwsh
        run: |
          $req = "${{ github.event.inputs.versao }}".Trim().TrimStart("v")
          if ($req) { $v = $req; "EZT_RELEASE=1" | Out-File -FilePath $env:GITHUB_ENV -Append }
          elseif ($env:GITHUB_REF_TYPE -eq "tag") { $v = $env:GITHUB_REF_NAME.TrimStart("v"); "EZT_RELEASE=1" | Out-File -FilePath $env:GITHUB_ENV -Append }
          else { $v = "0.5.0-dev." + $env:GITHUB_RUN_NUMBER }
          "EZT_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "versão $v"

      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Site
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - name: Dependências Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./backend[whisper]" "pyinstaller==6.22.3" "pywebview==6.2.1"

      - name: ffmpeg (com libass)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          $bin = (Get-ChildItem ffmpeg-dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          & "$bin\ffmpeg.exe" -hide_banner -filters | Select-String " ass "
          "EZT_FFMPEG_DIR=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Empacotar (PyInstaller)
        run: pyinstaller packaging/windows/eztractor.spec --noconfirm --distpath dist --workpath build

      - name: Autoteste do app empacotado
        shell: pwsh
        env:
          EZT_SELFTEST_WHISPER: "1"
        run: |
          $p = Start-Process -FilePath "dist\EzTractor\EzTractor.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\EzTractor\selftest.log"
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:LOCALAPPDATA\EzTractor\selftest-server.log" -Tail 80 -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Teste da janela do app (WebView2)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\EzTractor\EzTractor.exe" -ArgumentList "--gui-smoke" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Error "a janela não respondeu em 120 s"; exit 1 }
          Get-Content "$env:LOCALAPPDATA\EzTractor\gui-smoke.log" -ErrorAction SilentlyContinue
          Get-Content "$env:LOCALAPPDATA\EzTractor\eztractor.log" -Tail 40 -ErrorAction SilentlyContinue
          exit $p.ExitCode

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppVersion=$env:EZT_VERSION" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\*.exe | Format-Table Name, Length

      - name: Testar instalação silenciosa
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\EzTractor-Setup-*.exe | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          $exe = "$env:LOCALAPPDATA\Programs\EzTractor\EzTractor.exe"
          if (-not (Test-Path $exe)) { Write-Error "EzTractor.exe não foi instalado"; exit 1 }
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\EzTractor\selftest.log"
          exit $p.ExitCode

      - uses: actions/upload-artifact@v4
        with:
          name: EzTractor-Setup-${{ env.EZT_VERSION }}
          path: dist/EzTractor-Setup-*.exe
          retention-days: 30

      - name: Publicar Release
        if: env.EZT_RELEASE == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.EZT_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/EzTractor-Setup-*.exe
          name: EzTractor ${{ env.EZT_VERSION }}
          body: |
            Instalador do EzTractor para Windows (64 bits). Baixe o `EzTractor-Setup-${{ env.EZT_VERSION }}.exe` abaixo e execute.

            O app não é assinado digitalmente. Se o Windows mostrar "O Windows protegeu o computador", clique em **Mais informações → Executar assim mesmo**.
