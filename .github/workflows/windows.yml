name: Instalador Windows
# Gera EzTractor-Setup-<versão>.exe num Windows do GitHub, roda o autoteste do app empacotado
# e publica o instalador. Em tags v* (ex.: v0.5.0) cria um Release com o .exe para download.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão para publicar como Release (ex.: 0.5.0). Vazio = só gera o instalador."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    if: github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Versão
        shell: pwsh
        run: |
          $req = "${{ github.event.inputs.versao }}".Trim().TrimStart("v")
          if ($req) { $v = $req; "EZT_RELEASE=1" | Out-File -FilePath $env:GITHUB_ENV -Append }
          elseif ($env:GITHUB_REF_TYPE -eq "tag") { $v = $env:GITHUB_REF_NAME.TrimStart("v"); "EZT_RELEASE=1" | Out-File -FilePath $env:GITHUB_ENV -Append }
          else { $v = "0.5.0-dev." + $env:GITHUB_RUN_NUMBER }
          "EZT_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "versão $v"

      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Site
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - name: Dependências Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./backend[whisper]" "pyinstaller==6.22.3" "pywebview==6.2.1" "pyarmor==9.3.1"

      - name: ffmpeg (com libass)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          $bin = (Get-ChildItem ffmpeg-dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          & "$bin\ffmpeg.exe" -hide_banner -filters | Select-String " ass "
          "EZT_FFMPEG_DIR=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Versão no app
        shell: pwsh
        run: |
          (Get-Content packaging/windows/launcher.py) -replace 'APP_VERSION = "dev"', "APP_VERSION = `"$env:EZT_VERSION`"" | Set-Content packaging/windows/launcher.py
          Select-String 'APP_VERSION =' packaging/windows/launcher.py | Select-Object -First 1

      - name: Proteger codigo (PyArmor)
        run: python packaging/windows/obfuscate.py build/obf

      - name: Empacotar (PyInstaller)
        env:
          EZT_OBF_DIR: build/obf
        run: pyinstaller packaging/windows/eztractor.spec --noconfirm --distpath dist --workpath build

      - name: Autoteste do app empacotado
        shell: pwsh
        env:
          EZT_SELFTEST_WHISPER: "1"
        run: |
          $p = Start-Process -FilePath "dist\EzTractor\EzTractor.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\EzTractor\selftest.log"
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:LOCALAPPDATA\EzTractor\selftest-server.log" -Tail 80 -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Teste da janela do app (WebView2)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\EzTractor\EzTractor.exe" -ArgumentList "--gui-smoke" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Error "a janela não respondeu em 120 s"; exit 1 }
          Get-Content "$env:LOCALAPPDATA\EzTractor\gui-smoke.log" -ErrorAction SilentlyContinue
          Get-Content "$env:LOCALAPPDATA\EzTractor\eztractor.log" -Tail 40 -ErrorAction SilentlyContinue
          exit $p.ExitCode

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppVersion=$env:EZT_VERSION" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\*.exe | Format-Table Name, Length

      - name: Testar instalação silenciosa
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\EzTractor-Setup-*.exe | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          $exe = "$env:LOCALAPPDATA\Programs\EzTractor\EzTractor.exe"
          if (-not (Test-Path $exe)) { Write-Error "EzTractor.exe não foi instalado"; exit 1 }
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\EzTractor\selftest.log"
          exit $p.ExitCode

      - uses: actions/upload-artifact@v4
        with:
          name: EzTractor-Setup-${{ env.EZT_VERSION }}
          path: dist/EzTractor-Setup-*.exe
          retention-days: 30

      - name: Publicar Release (robusto, aguenta instabilidade do GitHub)
        if: env.EZT_RELEASE == '1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VER: ${{ env.EZT_VERSION }}
          SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Get-ChildItem dist\EzTractor-Setup-*.exe | Select-Object -First 1)
          if (-not $exe) { throw "instalador nao encontrado" }
          $tag = "v$env:VER"
          $body = "Instalador do EzTractor para Windows (64 bits). Baixe o ``$($exe.Name)`` abaixo e execute.`n`nO app nao e assinado digitalmente. Se o Windows mostrar 'O Windows protegeu o computador', clique em Mais informacoes -> Executar assim mesmo."

          # tenta uma chamada gh ate 8x, com espera crescente (atravessa 500/502/timeouts da API)
          function Try-Gh([ScriptBlock]$fn) {
            for ($i = 1; $i -le 8; $i++) {
              try { return & $fn } catch {
                Write-Host "tentativa $i falhou: $($_.Exception.Message)"
                if ($i -eq 8) { throw }
                Start-Sleep -Seconds (10 * $i)
              }
            }
          }

          # 1) garante o release (reaproveita se ja existir; senao cria)
          $relId = Try-Gh {
            $r = gh api "repos/$env:REPO/releases/tags/$tag" 2>$null | ConvertFrom-Json
            if ($r.id) { return $r.id }
            $c = gh api -X POST "repos/$env:REPO/releases" -f "tag_name=$tag" -f "target_commitish=$env:SHA" -f "name=EzTractor $env:VER" -f "body=$body" -F "make_latest=true" | ConvertFrom-Json
            return $c.id
          }
          Write-Host "release id: $relId"

          # 2) remove um asset antigo de mesmo nome (idempotente) e envia o novo via upload API
          Try-Gh {
            $assets = gh api "repos/$env:REPO/releases/$relId/assets" | ConvertFrom-Json
            foreach ($a in $assets) { if ($a.name -eq $exe.Name) { gh api -X DELETE "repos/$env:REPO/releases/assets/$($a.id)" | Out-Null } }
          }
          Try-Gh {
            $url = "https://uploads.github.com/repos/$env:REPO/releases/$relId/assets?name=$($exe.Name)"
            $h = @{ Authorization = "Bearer $env:GH_TOKEN"; "Content-Type" = "application/octet-stream"; "X-GitHub-Api-Version" = "2022-11-28" }
            Invoke-WebRequest -Uri $url -Method Post -Headers $h -InFile $exe.FullName -TimeoutSec 600 | Out-Null
          }

          # 3) confere que o asset ficou publicado
          $final = Try-Gh { gh api "repos/$env:REPO/releases/$relId/assets" | ConvertFrom-Json }
          if (-not ($final | Where-Object { $_.name -eq $exe.Name -and $_.state -eq "uploaded" })) {
            throw "o instalador nao ficou publicado no release"
          }
          Write-Host "publicado: $tag / $($exe.Name)"
