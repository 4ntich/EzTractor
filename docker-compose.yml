# Uso:
#   docker compose up -d                       -> abre http://localhost:8000
#   docker compose --profile ollama up -d      -> também sobe o Ollama num container
#
# Por padrão usa a imagem publicada pelo GitHub Actions. Para compilar localmente:
#   docker compose up -d --build
services:
  app:
    image: ghcr.io/4ntich/eztractor:latest
    build: .
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      # Ollama instalado direto no seu PC (recomendado, usa a placa de vídeo).
      # Se usar o perfil "ollama" abaixo, troque no .env para: EZT_OLLAMA_URL=http://ollama:11434
      EZT_OLLAMA_URL: ${EZT_OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - eztractor-data:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    # Placa NVIDIA (requer NVIDIA Container Toolkit): descomente
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

volumes:
  eztractor-data:
  ollama-models:
