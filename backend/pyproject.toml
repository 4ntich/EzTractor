[project]
name = "eztractor"
version = "0.1.0"
description = "EzTractor - transforma VODs de gameplay em clipes verticais com IA"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "pyjwt>=2.9",
  "python-multipart>=0.0.9",
  "rq>=1.16",
  "redis>=5.0",
  "anthropic>=2.14",
  "numpy>=1.26",
  "yt-dlp>=2024.8.6",
  "httpx>=0.27",
  "pillow>=10.0",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eztractor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
